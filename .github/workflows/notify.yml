name: 새 공고 메일 알림

on:
  schedule:
    - cron: '0 1 * * *'   # 한국시간 매일 아침 10:00 (UTC 01:00)
  workflow_dispatch:       # Actions 탭에서 수동 실행 가능
    inputs:
      force:
        description: '새 공고가 없어도 테스트 메일 발송'
        type: boolean
        default: false

permissions:
  contents: write          # data/seen.json (안내한 공고 기록) 커밋용

concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 새 공고 확인 및 메일 발송
        env:
          SERVICE_KEY: ${{ secrets.SERVICE_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_FORCE: ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '1' || '' }}
        # 나라장터 API가 오전에 간헐적으로 매우 느려져 워크플로 차원에서도 재시도
        run: |
          for attempt in 1 2 3; do
            if python notify.py; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::시도 $attempt 실패 — 3분 후 재시도합니다"
              sleep 180
            fi
          done
          echo "3회 모두 실패했습니다. 로그를 확인하세요."
          exit 1

      - name: 안내 기록 저장
        run: |
          if [ -n "$(git status --porcelain data/seen.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/seen.json
            git commit -m "메일 알림 상태 갱신"
            git pull --rebase origin main
            git push || (git pull --rebase origin main && git push)
          else
            echo "상태 변경 없음"
          fi
